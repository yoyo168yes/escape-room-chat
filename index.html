<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>★快樂的無盡密室之旅★</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --pink:#FF3D8C;
    --violet:#8C4DFF;
    --cyan:#34E4EA;
    --yellow:#FFD23F;
    --ink:#231933;
    --night:#1B1533;
    --night2:#241C3D;
    --bubble-dark:#33294f;
    --bubble-text:#f3eefc;
    --fog:#5c6b7a;
    --fog-text:#161b20;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0;
    padding:0;
    height:100%;
    font-family:"Noto Sans TC",sans-serif;
    background:
      radial-gradient(circle at 15% 20%, #2a1f4d 0%, transparent 45%),
      radial-gradient(circle at 85% 80%, #1f2b4d 0%, transparent 45%),
      #14101f;
    color:var(--ink);
    -webkit-tap-highlight-color:transparent;
  }
  #phone-wrap{
    min-height:100%;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px 12px;
  }
  #phone{
    position:relative;
    width:100%;
    max-width:410px;
    height:min(860px, 92vh);
    background:var(--night);
    border-radius:36px;
    overflow:hidden;
    box-shadow:0 30px 60px -20px rgba(0,0,0,.7), 0 0 0 8px #0c0916, 0 0 0 10px #2a2440;
    display:flex;
    flex-direction:column;
  }
  /* fake status bar */
  .statusbar{
    height:34px;
    flex:0 0 auto;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 22px;
    font-size:12px;
    font-weight:700;
    color:#fff;
    letter-spacing:.3px;
    z-index:5;
  }
  .statusbar .icons{display:flex;gap:5px;align-items:center;opacity:.9;}
  .notch{
    position:absolute;
    top:0;left:50%;
    transform:translateX(-50%);
    width:150px;height:22px;
    background:#0c0916;
    border-radius:0 0 16px 16px;
    z-index:6;
  }

  #screen{
    position:relative;
    flex:1 1 auto;
    overflow:hidden;
    display:flex;
    flex-direction:column;
  }

  /* ---------- HOME ---------- */
  .home{
    position:relative;
    height:100%;
    width:100%;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:38px;
    padding:20px 26px 26px;
    background:
      radial-gradient(circle at 20% 10%, rgba(255,61,140,.55), transparent 40%),
      radial-gradient(circle at 85% 15%, rgba(52,228,234,.4), transparent 45%),
      radial-gradient(circle at 50% 90%, rgba(140,77,255,.55), transparent 50%),
      linear-gradient(160deg,#1c1436,#241a44 60%, #170f2b);
    overflow:hidden;
  }
  .blob{
    position:absolute;
    border-radius:50%;
    filter:blur(2px);
    opacity:.55;
    animation:float 7s ease-in-out infinite;
  }
  .blob.b1{width:120px;height:120px;background:var(--pink);top:8%;left:-30px;animation-delay:0s;}
  .blob.b2{width:90px;height:90px;background:var(--cyan);bottom:22%;right:-20px;animation-delay:1.5s;}
  .blob.b3{width:60px;height:60px;background:var(--yellow);top:38%;right:18px;animation-delay:.7s;}
  @keyframes float{
    0%,100%{transform:translateY(0px);}
    50%{transform:translateY(-16px);}
  }
  .info-btn{
    position:absolute;
    top:16px;left:18px;
    width:40px;height:40px;
    border-radius:50%;
    background:rgba(255,255,255,.14);
    border:1.5px solid rgba(255,255,255,.5);
    color:#fff;
    font-size:19px;
    font-weight:900;
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;
    z-index:4;
    backdrop-filter:blur(4px);
  }
  .info-btn:active{transform:scale(.92);}

  .home-top{width:100%;text-align:center;z-index:2;}
  .badge{
    display:inline-block;
    font-size:12px;
    font-weight:700;
    color:#1c1436;
    background:var(--yellow);
    padding:5px 14px;
    border-radius:999px;
    margin-bottom:16px;
    letter-spacing:.5px;
    transform:rotate(-3deg);
  }
  .home-title{
    font-size:34px;
    font-weight:900;
    line-height:1.35;
    color:#fff;
    margin:0;
    text-shadow:0 4px 0 rgba(0,0,0,.25);
    text-align:center;
  }
  .home-title .title-star{
    background:linear-gradient(90deg,var(--pink),var(--yellow));
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
  }
  .home-title .title-text{
    color:#fff;
  }
  .home-sub{
    margin-top:14px;
    font-size:14px;
    color:#d9d2f5;
    line-height:1.6;
  }

  .home-mid{z-index:2;}
  .toilet-emoji{font-size:64px;filter:drop-shadow(0 8px 10px rgba(0,0,0,.35));}

  .home-bottom{width:100%;z-index:2;display:flex;flex-direction:column;align-items:center;gap:14px;}
  .btn{
    width:100%;
    max-width:280px;
    border:none;
    border-radius:999px;
    padding:16px 20px;
    font-family:inherit;
    font-size:16px;
    font-weight:700;
    cursor:pointer;
    text-align:center;
    transition:transform .12s ease, box-shadow .12s ease;
  }
  .btn:active{transform:scale(.96);}
  .btn-primary{
    color:#1c1436;
    background:linear-gradient(90deg,var(--yellow),#ffb3e0 60%, var(--pink));
    box-shadow:0 10px 22px -6px rgba(255,61,140,.55);
  }
  .btn-secondary{
    color:#fff;
    background:rgba(255,255,255,.08);
    border:1.5px solid rgba(255,255,255,.55);
  }
  .footer-links{
    position:absolute;
    left:0;
    right:0;
    bottom:16px;
    z-index:3;
    display:flex;
    justify-content:center;
    gap:18px;
    font-size:12px;
  }
  .footer-links a{
    color:#c9c1ec;
    text-decoration:none;
    border-bottom:1px dashed rgba(201,193,236,.6);
  }

  /* ---------- CHAT CHROME (used for naming / story) ---------- */
  .chat{
    position:relative;
    height:100%;
    display:flex;
    flex-direction:column;
    background:var(--night2);
  }
  .chat-header{
    flex:0 0 auto;
    display:flex;
    align-items:center;
    gap:10px;
    padding:10px 16px;
    background:#20182f;
    border-bottom:1px solid rgba(255,255,255,.06);
  }
  .chat-header.simple .chat-title{font-size:15.5px;}
  .examine-tag{
    flex:0 0 auto;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    min-height:34px;
    background:#20182f;
    color:#b7aee0;
    font-size:12px;
    font-weight:700;
    padding:8px 16px;
    box-sizing:border-box;
    border-bottom:1px solid rgba(255,255,255,.06);
  }
  .chat-avatar{
    width:34px;height:34px;border-radius:50%;
    background:linear-gradient(135deg,var(--violet),var(--pink));
    display:flex;align-items:center;justify-content:center;
    font-weight:900;color:#fff;font-size:15px;
    flex:0 0 auto;
  }
  .chat-title{color:#fff;font-weight:700;font-size:15px;line-height:1.2;}
  .chat-status{color:#8a81ad;font-size:11px;}
  .home-link-btn{
    margin-left:auto;
    border:none;
    border-radius:999px;
    padding:7px 14px;
    font-family:inherit;
    font-size:12.5px;
    font-weight:700;
    color:#fff;
    background:rgba(255,255,255,.1);
    border:1px solid rgba(255,255,255,.28);
    cursor:pointer;
    flex:0 0 auto;
  }
  .home-link-btn:active{transform:scale(.94);}

  .chat-body{
    flex:1 1 auto;
    overflow-y:auto;
    padding:18px 16px 10px;
    display:flex;
    flex-direction:column;
    gap:10px;
    -webkit-overflow-scrolling:touch;
  }
  .chat-body::-webkit-scrollbar{width:0;}

  .bubble{
    max-width:82%;
    padding:12px 15px;
    border-radius:18px;
    font-size:14.5px;
    line-height:1.65;
    animation:pop .28s ease;
    box-shadow:0 4px 10px rgba(0,0,0,.18);
  }
  @keyframes pop{
    from{opacity:0; transform:translateY(10px) scale(.97);}
    to{opacity:1; transform:translateY(0) scale(1);}
  }

  /* 畫面切換：舊氣泡先一起淡出，避免直接重繪造成閃爍 */
  #screen.switching .bubble,
  #screen.switching .scene-illustration,
  #screen.switching .tap-hint,
  #screen.switching .action-area > *{
    opacity:0 !important;
    transform:translateY(-4px) scale(.985);
    transition:opacity .18s ease, transform .18s ease;
    animation:none !important;
    pointer-events:none;
  }
  .bubble.left{
    align-self:flex-start;
    background:var(--bubble-dark);
    color:var(--bubble-text);
    border-bottom-left-radius:4px;
  }
  .bubble.right{
    align-self:flex-end;
    background:linear-gradient(90deg,var(--pink),var(--violet));
    color:#fff;
    border-bottom-right-radius:4px;
  }
  .bubble.player-answer{
    align-self:flex-end;
    background:#666;
    color:#fff;
    border-bottom-right-radius:4px;
  }
  .bubble.system{
    align-self:center;
    background:transparent;
    color:#8a81ad;
    font-size:12px;
    box-shadow:none;
  }
  .bubble.locations-bubble{max-width:96%;}
  .theme-fog .bubble.locations-bubble{
    background:var(--bubble-dark);
    color:var(--bubble-text);
  }
  .locations-bubble{
    display:grid;
    grid-template-columns:repeat(3, 1fr);
    gap:14px 10px;
  }
  .loc-line{
    color:#FF9224;
    font-weight:800;
    cursor:pointer;
    text-align:center;
  }
  .loc-line:active{opacity:.6;}
  .bold-line{
    font-weight:800;
    letter-spacing:1px;
  }
  .image-bubble{
    text-align:center;
    padding:10px 10px 8px;
  }
  .image-bubble img{
    max-width:140px;
    width:100%;
    border-radius:10px;
    display:block;
    margin:0 auto;
    cursor:zoom-in;
  }
  .image-caption{
    margin-top:6px;
    font-size:11px;
    color:#8a81ad;
  }
  .theme-fog .image-caption{color:#5a6675;}
  .badend-banner{
    align-self:stretch;
    text-align:center;
    margin:14px 0 4px;
    padding:18px 16px;
    border-radius:18px;
    background:#000;
    border:none;
    width:100%;
    max-width:none;
  }
  .badend-title{
    color:#ff1f32;
    font-weight:900;
    font-size:17px;
    letter-spacing:1px;
  }
  .badend-hint{
    margin-top:7px;
    color:#8a8a8a;
    font-size:10.5px;
    font-weight:400;
  }
  .theme-fog .badend-hint{color:#8a8a8a;}
  .modal-overlay.lightbox-overlay{
    background:rgba(5,3,10,.9);
    padding:22px;
  }
  .lightbox-img{
    max-width:100%;
    max-height:100%;
    border-radius:14px;
    object-fit:contain;
  }

  .scene-illustration{
    align-self:stretch;
    width:calc(100% + 32px);
    margin:-18px -16px 8px;
  }
  .scene-illustration img,
  .scene-illustration svg{
    width:100%;
    height:auto;
    display:block;
    object-fit:contain;
  }

  .tap-hint{
    flex:0 0 auto;
    text-align:center;
    font-size:12px;
    color:#8a81ad;
    padding:6px 0 14px;
    animation:blink 1.6s infinite;
  }
  @keyframes blink{
    0%,100%{opacity:.35;}
    50%{opacity:1;}
  }

  .hint-fab{
    position:absolute;
    right:14px;
    bottom:14px; /* 由 positionHintFab() 動態移到淺灰聊天區右下角 */
    width:46px;
    height:46px;
    min-width:46px;
    padding:0;
    border-radius:50%;
    border:1px solid rgba(255,255,255,.28);
    background:linear-gradient(135deg,var(--violet),var(--pink));
    color:#fff;
    font-family:inherit;
    font-size:0;
    font-weight:900;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    box-shadow:0 6px 18px rgba(0,0,0,.32);
    z-index:30;
  }
  .hint-fab::before{
    content:'?';
    font-size:22px;
    line-height:1;
  }
  .hint-fab:active{transform:scale(.92);}

  .action-area{
    flex:0 0 auto;
    padding:10px 16px 18px;
    display:flex;
    flex-direction:column;
    gap:10px;
  }
  .chip-row{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    justify-content:center;
  }
  .chip{
    border:none;
    border-radius:999px;
    padding:10px 18px;
    font-family:inherit;
    font-size:14px;
    font-weight:700;
    color:#1c1436;
    background:linear-gradient(90deg,var(--cyan),var(--yellow));
    cursor:pointer;
    box-shadow:0 6px 14px -4px rgba(52,228,234,.5);
    animation:pop .3s ease;
  }
  .chip:active{transform:scale(.95);}
  .chip.small{
    background:rgba(255,255,255,.08);
    color:#e9e4fb;
    border:1px solid rgba(255,255,255,.28);
    box-shadow:none;
    font-size:13px;
    padding:9px 14px;
  }

  .name-input-row{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    animation:pop .3s ease;
  }
  .name-input-row input{
    flex:1 1 140px;
    border-radius:999px;
    border:1.5px solid rgba(255,255,255,.3);
    background:rgba(255,255,255,.06);
    color:#fff;
    padding:12px 16px;
    font-size:14.5px;
    font-family:inherit;
    outline:none;
  }
  .name-input-row input::placeholder{color:#8a81ad;}
  .name-input-row button{
    border:none;
    border-radius:999px;
    padding:0 20px;
    font-weight:700;
    font-family:inherit;
    background:linear-gradient(90deg,var(--pink),var(--violet));
    color:#fff;
    cursor:pointer;
  }

  /* wake scene fog theme */
  .theme-fog .chat-body{background:linear-gradient(180deg, var(--fog), #4a5866);}
  .theme-fog.danger-red .chat-body{
    background:linear-gradient(180deg, #351417, #6d171d);
    transition:background 1.25s ease;
  }
  .danger-countdown{
    width:min(360px, calc(100% - 28px));
    height:7px;
    margin:8px auto 0;
    border-radius:999px;
    overflow:hidden;
    background:rgba(255,255,255,.16);
  }
  .danger-countdown > span{
    display:block;
    width:100%;
    height:100%;
    background:#b3262e;
    transform-origin:left center;
    animation:dangerCountdown 2s linear forwards;
  }
  @keyframes dangerCountdown{to{transform:scaleX(0);}}
  .theme-fog .bubble.left{background:rgba(255,255,255,.85); color:var(--fog-text);}
  .theme-fog .chat-body{color:var(--fog-text);}

  /* ---------- FALLING SCREEN ---------- */
  .falling{
    height:100%;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#000;
    color:#eee;
    text-align:center;
    padding:0 30px;
    font-size:17px;
    letter-spacing:.5px;
    cursor:pointer;
  }

  /* ---------- LEVEL SELECT ---------- */
  .level-select{
    height:100%;
    display:flex;
    flex-direction:column;
    background:var(--night2);
    padding:18px 18px 24px;
  }
  .ls-header{display:flex;align-items:center;gap:10px;margin-bottom:18px;}
  .back-btn{
    width:34px;height:34px;border-radius:50%;
    background:rgba(255,255,255,.08);
    border:none;color:#fff;font-size:16px;
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;
  }
  .ls-title{color:#fff;font-weight:900;font-size:18px;}
  .level-card{
    display:flex;align-items:center;gap:12px;
    background:rgba(255,255,255,.06);
    border:1px solid rgba(255,255,255,.1);
    border-radius:16px;
    padding:14px 16px;
    margin-bottom:12px;
    cursor:pointer;
  }
  .level-card.locked{opacity:.45; cursor:not-allowed;}
  .level-num{
    width:42px;height:42px;border-radius:12px;
    background:linear-gradient(135deg,var(--pink),var(--violet));
    color:#fff;font-weight:900;font-size:16px;
    display:flex;align-items:center;justify-content:center;
    flex:0 0 auto;
  }
  .level-card.locked .level-num{background:#3a3355;}
  .level-info{flex:1; min-width:0;}
  .level-name{color:#fff;font-weight:700;font-size:14.5px;}
  .level-desc{color:#a89fcf;font-size:12px;margin-top:2px;}
  .clear-progress-btn{
    flex:0 0 auto;
    border:1px solid rgba(255,255,255,.25);
    background:rgba(255,255,255,.06);
    color:#d8d1f0;
    font-size:11px;
    font-weight:700;
    font-family:inherit;
    padding:7px 12px;
    border-radius:999px;
    cursor:pointer;
  }
  .clear-progress-btn:active{transform:scale(.94);}

  /* ---------- MODAL ---------- */
  .modal-overlay{
    position:absolute;inset:0;
    background:rgba(10,7,20,.72);
    display:flex;align-items:center;justify-content:center;
    padding:26px;
    z-index:20;
    opacity:0;
    pointer-events:none;
    transition:opacity .25s ease;
  }
  .modal-overlay.open{opacity:1; pointer-events:auto;}
  .modal-card{
    background:#2a2244;
    border-radius:22px;
    padding:24px 22px 20px;
    max-width:320px;
    width:100%;
    box-shadow:0 20px 50px rgba(0,0,0,.5);
    transform:translateY(14px);
    transition:transform .25s ease;
  }
  .modal-overlay.open .modal-card{transform:translateY(0);}
  .modal-title{color:#fff;font-weight:900;font-size:17px;margin:0 0 12px;}
  .modal-text{color:#d8d1f0;font-size:13.5px;line-height:1.75;white-space:pre-line;}
  .inventory-popup-item{
    width:100%;
    border:1px solid rgba(255,255,255,.16);
    border-radius:14px;
    padding:10px 12px;
    background:rgba(255,255,255,.08);
    color:#fff;
    font:inherit;
    font-weight:900;
    text-align:center;
    cursor:pointer;
  }
  .inventory-popup-item:active{transform:scale(.98);}

  .modal-btn{
    margin-top:18px;
    width:100%;
    border:none;
    border-radius:999px;
    padding:12px;
    font-family:inherit;
    font-weight:700;
    font-size:14.5px;
    color:#1c1436;
    background:linear-gradient(90deg,var(--yellow),var(--cyan));
    cursor:pointer;
  }
</style>
</head>
<body>
<div id="phone-wrap">
  <div id="phone">
    <div class="notch"></div>
    <div class="statusbar">
      <span id="clock">9:41</span>
      <div class="icons">
        <span>••••</span><span>Wi-Fi</span><span>🔋</span>
      </div>
    </div>
    <div id="screen"></div>
    <div class="modal-overlay" id="infoModal">
      <div class="modal-card">
        <p class="modal-title">遊戲說明</p>
        <p class="modal-text">歡迎來到無盡的密室逃脫世界！
這款遊戲劇情始終如一簡單、解謎則是會隨著進度越來越難！
照例偶爾有一～～點點恐怖的東西，請小心服用。
部分謎題需輸入文字，必須使用「繁體中文」才能順利進行。
如發現bug或改進建議，歡迎來信回報。
yoyo168yes@gmail.com</p>
        <button class="modal-btn" id="closeInfo">了解</button>
      </div>
    </div>
  </div>
</div>

<script>
const screenEl = document.getElementById('screen');
const infoModal = document.getElementById('infoModal');

document.getElementById('closeInfo').addEventListener('click', ()=> infoModal.classList.remove('open'));

// live clock for the fake status bar, small nice touch
function tickClock(){
  const d = new Date();
  const h = d.getHours().toString().padStart(2,'0');
  const m = d.getMinutes().toString().padStart(2,'0');
  document.getElementById('clock').textContent = h+':'+m;
}
tickClock(); setInterval(tickClock, 15000);

function getName(){ try{return localStorage.getItem('erc_playerName')||'';}catch(e){return '';} }
function setName(n){ try{localStorage.setItem('erc_playerName', n);}catch(e){} }

let isSwitchingScreen = false;
function fadeTo(renderFn){
  if(isSwitchingScreen) return;
  isSwitchingScreen = true;

  // 先讓目前畫面中的所有氣泡／操作元件一起消失。
  // 不先清空 screen，因此切換途中不會出現背景閃白或瞬間空畫面。
  screenEl.classList.add('switching');

  setTimeout(()=>{
    renderFn();
    screenEl.classList.remove('switching');
    isSwitchingScreen = false;
  }, 190);
}

/* ---------------- HOME ---------------- */
function renderHome(){
  screenEl.innerHTML = `
    <div class="home">
      <div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div>

  function reveal(){
    if(idx < lines.length){
      addBubble(body, lines[idx], 'left');

        hint.style.display = 'none';

/* 通用的逐行點擊顯示引擎：陣列項目可以是文字（一行對話）或函式（自訂動作，例如彈窗、切換底部按鈕） */
let activeEnterAdvance = null;
document.addEventListener('keydown', (e)=>{
  if(e.key !== 'Enter' || e.repeat || !activeEnterAdvance) return;
  if(document.querySelector('.popup-overlay, .lightbox')) return;
  const tag = (document.activeElement && document.activeElement.tagName || '').toLowerCase();
  if(tag === 'input' || tag === 'textarea' || tag === 'button' || tag === 'a') return;
  // 只有純劇情閱讀、沒有選項／操作按鈕時，Enter 才等同點擊畫面。
  const actionArea = document.getElementById('actionArea');
  if(actionArea && actionArea.querySelector('button, input, a')) return;
  e.preventDefault();
  const fn = activeEnterAdvance;
  activeEnterAdvance = null;
  fn();
});

function runSteps(steps){
  let i = 0;
  let waitingForClick = false;
  const chatEl = document.querySelector('.chat');
  function advance(){
    if(i >= steps.length){ hint.style.display = 'none'; waitingForClick = false; activeEnterAdvance = null; return; }
    const step = steps[i++];
    if(typeof step === 'function'){
      hint.style.display = 'none';
      waitingForClick = false;
      activeEnterAdvance = null;
      step(advance);
    } else if(typeof step === 'object'){
      if(step.image){
        addImageBubble(step.image, step.caption);
      } else {
        addBubble(body, step.text, step.type || 'left');
      }
      scrollDown();
      waitingForClick = i < steps.length;
      activeEnterAdvance = waitingForClick ? advance : null;
      hint.style.display = waitingForClick ? 'block' : 'none';
    } else {
      addBubble(body, step, 'left');
      scrollDown();
      waitingForClick = i < steps.length;
      activeEnterAdvance = waitingForClick ? advance : null;
      hint.style.display = waitingForClick ? 'block' : 'none';
    }
  }
  function clickHandler(e){
    if(e.target.closest('.home-link-btn') || e.target.closest('.chip-row') || e.target.closest('.name-input-row')) return;
    if(waitingForClick){ waitingForClick = false; activeEnterAdvance = null; advance(); }
  }
  chatEl.addEventListener('click', clickHandler);
  advance();
  return {
    extend(moreSteps){
      steps.push(...moreSteps);
      advance();
    }
  };
}

  body = document.getElementById('chatBody');
  hint = document.getElementById('tapHint');
  action = document.getElementById('actionArea');
  stepRunner = runSteps([
    `恭喜${playerName}挑戰成功！`,
    '第二關正在移植中，歡迎追蹤我的帳號，獲取更新情報！',
    ()=>{
      hint.style.display = 'none';
      action.innerHTML = `
        <div class="chip-row">
          <a class="chip" href="https://www.threads.com/@xiaoer_1996" target="_blank" rel="noopener" style="text-decoration:none;display:inline-flex;align-items:center;justify-content:center;">前往作者帳號</a>
          <button class="chip small" id="clearHomeBtn">回首頁</button>
        </div>`;
      document.getElementById('clearHomeBtn').addEventListener('click', ()=> fadeTo(renderHome));
    }
  ]);
}

/* ---- 尚未實作的地點 ---- */
function genericSteps(spot){
  return [
    { text:`（「${spot}」調查內容尚未完成，敬請期待下次更新！）`, type:'system' },
    ()=>{ showStandardActions(spot); }
  ];
}

/* ---- 將提示圓鈕固定在聊天區（淺灰底）右下角，不跟著訊息捲動 ---- */
function positionHintFab(btn){
  if(!btn) return;
  const chat = btn.closest('.chat');
  if(!chat) return;

  // 同一個聊天畫面永遠只保留目前這一顆提示鈕。
  // 舊提示鈕可能已被移到 .chat 底下，因此 action.innerHTML 更新時不會自動消失。
  chat.querySelectorAll('.hint-fab').forEach(oldBtn => {
    if(oldBtn !== btn) oldBtn.remove();
  });

  // 提示鈕不放在下方 action-area 黑欄裡，而是直接掛到 chat 上。
  if(btn.parentElement !== chat) chat.appendChild(btn);

  const actionArea = chat.querySelector('.action-area');
  const tapHint = chat.querySelector('.tap-hint');
  const actionH = actionArea ? actionArea.offsetHeight : 0;
  const tapH = tapHint && getComputedStyle(tapHint).display !== 'none' ? tapHint.offsetHeight : 0;
  btn.style.bottom = `${actionH + tapH + 12}px`;
}

/* ---- 通用「道具欄／返回／提示」列 ---- */
function showStandardActions(context, extraActions){
  const extraHtml = extraActions ? extraActions.map((a,i)=>`<button class="chip" data-extra="${i}">${a.label}</button>`).join('') : '';
  action.innerHTML = `
    <div class="chip-row">
      ${extraHtml}
      <button class="chip" id="inventoryBtn2">道具欄</button>
      <button class="chip small" id="backBtn2">返回</button>
    </div>
    <button class="hint-fab" id="hintBtn" aria-label="提示" title="提示">提示</button>`;
  if(extraActions){
    extraActions.forEach((a,i)=>{
      action.querySelector(`[data-extra="${i}"]`).addEventListener('click', a.onClick);
    });
  }
  document.getElementById('inventoryBtn2').addEventListener('click', ()=> showInventoryPopup(context));
  document.getElementById('backBtn2').addEventListener('click', ()=> fadeTo(renderInvestigate));
  const hintBtn = document.getElementById('hintBtn');
  hintBtn.addEventListener('click', ()=> popup('此處沒有提示！'));
  requestAnimationFrame(()=> positionHintFab(hintBtn));
}

function showInventoryPopup(context){
  const phone = document.getElementById('phone');
  const ov = document.createElement('div');
  ov.className = 'modal-overlay open';

  const itemHtml = inventory.length
    ? inventory.map(id=>`<button class="inventory-popup-item" data-item="${id}">${ITEM_NAMES[id] || id}</button>`).join('')
    : '<div style="color:#aaa;font-size:13px;margin-top:12px;">目前沒有任何道具。</div>';

  ov.innerHTML = `
    <div class="modal-card">
      <p class="modal-text" style="white-space:normal;">
        <strong style="color:#fff;font-size:16px;">道具欄</strong><br>
        <span style="display:block;color:#aaa;font-size:11.5px;margin-top:5px;">點擊道具即可使用。</span>
      </p>
      <div style="display:flex;flex-direction:column;gap:8px;margin-top:14px;">${itemHtml}</div>
    </div>`;
  phone.appendChild(ov);

  ov.querySelectorAll('[data-item]').forEach(btn=>{
    btn.addEventListener('click', (e)=>{
      e.stopPropagation();
      const itemId = btn.dataset.item;
      ov.remove();
      if(context){
        applyItem(itemId, context);
      }else{
        popup(ITEM_DESCRIPTIONS[itemId] || '');
      }
    });
  });
  ov.addEventListener('click', ()=> ov.remove());
}

function useItem(context){
  if(inventory.length === 0){
    addBubble(body, '空空如也……', 'system');
    scrollDown();
    return;
  }
  action.innerHTML = `
    <div class="chip-row">
      ${inventory.map(id=>`<button class="chip small" data-item="${id}">${ITEM_NAMES[id]}</button>`).join('')}
      <button class="chip small" id="cancelUse">取消</button>
    </div>`;
  action.querySelectorAll('[data-item]').forEach(btn=>{
    btn.addEventListener('click', ()=> applyItem(btn.dataset.item, context));
  });
  document.getElementById('cancelUse').addEventListener('click', ()=> showStandardActions(context));
}

function applyItem(itemId, context){
  if(itemId === 'small_key' && context === '馬桶' && flags.toiletTankTried && !flags.toiletUnlocked){
    flags.toiletUnlocked = true;
    consumeItem('small_key');
    action.innerHTML = '';
    stepRunner.extend([
      '水箱裡有一張用夾鏈袋封存的紙條。',
      { image:'https://images.plurk.com/6QwobT4HfivZLXS1Lmlg8T.png', caption:'點擊可放大圖片' },
      '似乎是把中文字拆開打亂之後的樣子，應該可以組合成完整的句子才對。',
      '是什麼意思呢……',
      ()=>{ showToiletAnswerInput(); }
    ]);
    return;
  }
  if(itemId === 'daoguang_coin' && context === '牆壁' && !flags.wallCoinInserted){
    flags.wallCoinInserted = true;
    consumeItem('daoguang_coin');
    action.innerHTML = '';
    stepRunner.extend([
      '將剛才找到的道光通寶嵌進凹槽裡，磁磚發出咿咿呀呀的聲音往旁邊打開了。',
      '出現了一個四方形的洞口，大小剛好可以容納手臂。',
      '裡面漆黑一片……',
      ()=>{ showStandardActions('牆壁'); }
    ]);
    return;
  }
  if(itemId === 'flashlight' && context === '牆壁' && flags.wallCoinInserted && !flags.wallLit){
    flags.wallLit = true;
    action.innerHTML = '';
    stepRunner.extend([
      '拿出手電筒照明，但裡面似乎是個非常大的空間，微弱的光線無法看清深處的景象。',
      '似乎有個疑似人形的物體……',
      '會是同伴嗎？',
      '在密室中見到人影，讓我燃起一線希望。',
      '試著呼喚幾聲，他沒有反應，要怎麼引起他的注意呢？',
      ()=>{ showStandardActions('牆壁'); }
    ]);
    return;
  }
  if(itemId === 'flashlight' && context === '天花板' && !flags.ceilingBoxFound){
    flags.ceilingBoxFound = true;
    action.innerHTML = '';
    stepRunner.extend([
      '拿起剛才找到的手電筒，朝著漆黑深處照去。',
      '發現了一個沉甸甸的，用報紙層層包裹的方形物體。',
      '將報紙拆開之後，出現了一個精緻的小鐵盒，上面一道有四位數字的密碼鎖。',
      '輕輕搖晃了下，發出許多東西的碰撞聲。',
      '密碼到底是什麼呢……',
      ()=>{ showCodeInput(); }
    ]);
    return;
  }
  if(itemId === 'rinse_cup' && context === '洗手臺' && sinkStage === 'faucet' && !flags.keyFound){
    flags.keyFound = true;
    consumeItem('rinse_cup');
    action.innerHTML = '';
    stepRunner.extend([
      '用漱口杯接了水。',
      '過了一會，有什麼東西順著水流了出來。',
      '是一把精緻的小鑰匙。',
      (advance)=>{
        inventory.push('small_key');
        popup('獲得了道具「小鑰匙」！', ()=> advance());
      },
      ()=>{ showStandardActions('洗手臺'); }
    ]);
    return;
  }
  if(itemId === 'towel' && context === '馬桶' && !flags.toiletCleaned){
    flags.toiletCleaned = true;
    consumeItem('towel');
    action.innerHTML = '';
    stepRunner.extend([
      '用毛巾沾水擦了一下，露出白色的馬桶座。',
      '座盤上不知為何有個「血」字。',
      '學妹的品味好奇怪……',
      ()=>{ showStandardActions('馬桶', flags.toiletUnlocked && !flags.toiletRiddleSolved ? [{ label:'查看紙條', onClick: showToiletNote }] : (!flags.toiletUnlocked ? [{ label:'打開水箱', onClick: openToiletTank }] : [])); }
    ]);
    return;
  }
  if(itemId === 'iron_rod' && context === '牆壁' && flags.wallArmEscaped && flags.expandedSearch && !flags.wallRodResolved){
    startIronRodWallSequence();
    return;
  }
  if(itemId === 'bloody_iron_rod' && context === '馬桶' && !flags.toiletBloodApplied){
    applyBloodyRodToToilet();
    return;
  }
  if(itemId === 'own_arm' && context === '牆壁' && flags.wallLit && !flags.wallArmEscaped){
    flags.wallArmTried = true;
    consumeItem('own_arm');
    action.innerHTML = '';
    stepRunner.extend([
      '根據紙條上的提示，好像是要把手放進去的樣子。',
      '但還是有點猶豫……',
      ()=>{ showArmChoice(); }
    ]);
    return;
  }
  addBubble(body, `使用了「${ITEM_NAMES[itemId]}」，但這裡好像用不上。`, 'system');
  scrollDown();
  showStandardActions(context);
}

/* ---- 密碼輸入（天花板小鐵盒） ---- */
function showCodeInput(){
  action.innerHTML = `
    <div class="name-input-row">
      <input id="codeInput" type="text" inputmode="numeric" maxlength="4" placeholder="輸入四位數密碼">
      <button class="chip small" id="codeConfirmBtn">確定</button>
      <button class="chip small" id="codeBackBtn">返回</button>
    </div>
    <button class="hint-fab" id="codeHintBtn" aria-label="提示" title="提示">提示</button>`;
  const codeHintBtn = document.getElementById('codeHintBtn');
  codeHintBtn.addEventListener('click', ()=> popup('提示：密碼與字義無關。'));
  requestAnimationFrame(()=> positionHintFab(codeHintBtn));
  document.getElementById('codeBackBtn').addEventListener('click', ()=> fadeTo(renderInvestigate));
  const inp = document.getElementById('codeInput');
  document.getElementById('codeConfirmBtn').addEventListener('click', ()=> submitCode(inp.value.trim()));
  inp.addEventListener('keydown', (e)=>{
    if(e.key === 'Enter') submitCode(inp.value.trim());
  });
}
function submitCode(val){
  if(!val) return;
  addBubble(body, val, 'player-answer');
  scrollDown();
  if(val === '2354'){
    flags.ceilingSolved = true;
    action.innerHTML = '';
    stepRunner.extend([
      '輸入密碼後，箱子打開了。',
      '裡面裝滿了銅板，仔細一看，都是不同國家的貨幣。',
      '被其中一枚銅板吸引了目光。',
      (advance)=>{
        addImageBubble('https://images.plurk.com/5ZSLoCgWZmOnODcsTcT0WP.jpg', '點擊可放大圖片');
        scrollDown();
        inventory.push('daoguang_coin');
        popup('獲得了道具「道光通寶」！', ()=> advance());
      },
      ()=>{ showStandardActions('天花板'); }
    ]);
  } else {
    addBubble(body, '好像不對……', 'system');
    scrollDown();
  }
}

/* ---- 可放大檢視的線索圖片 ---- */
function addImageBubble(url, caption){
  const div = document.createElement('div');
  div.className = 'bubble left image-bubble';
  div.innerHTML = `<img src="${url}" alt="線索照片"><div class="image-caption">${caption}</div>`;
  body.appendChild(div);
  div.querySelector('img').addEventListener('click', ()=> openLightbox(url));
}
function openLightbox(url){
  const phone = document.getElementById('phone');
  const ov = document.createElement('div');
  ov.className = 'modal-overlay open lightbox-overlay';
  ov.innerHTML = `<img src="${url}" class="lightbox-img" alt="放大圖片">`;
  phone.appendChild(ov);
  ov.addEventListener('click', ()=> ov.remove());
}

/* ---- 通用彈窗（點擊畫面任一處即可關閉） ---- */
function popup(text, onClose){
  const phone = document.getElementById('phone');
  const ov = document.createElement('div');
  ov.className = 'modal-overlay open';
  ov.innerHTML = `<div class="modal-card"><p class="modal-text" style="white-space:normal;">${text}</p></div>`;
  phone.appendChild(ov);
  ov.addEventListener('click', ()=>{
    ov.remove();
    if(onClose) onClose();
  });
  return ov;
}

function confirmPopup(text, onYes, onNo){
  const phone = document.getElementById('phone');
  const ov = document.createElement('div');
  ov.className = 'modal-overlay open';
  ov.innerHTML = `
    <div class="modal-card">
      <p class="modal-text" style="white-space:normal;">${text}</p>
      <div style="display:flex; gap:10px; margin-top:18px;">
        <button class="modal-btn" id="confirmYes" style="margin-top:0;">是</button>
        <button class="modal-btn" id="confirmNo" style="margin-top:0; background:rgba(255,255,255,.12); color:#fff;">否</button>
      </div>
    </div>`;
  phone.appendChild(ov);
  document.getElementById('confirmYes').addEventListener('click', ()=>{ ov.remove(); if(onYes) onYes(); });
  document.getElementById('confirmNo').addEventListener('click', ()=>{ ov.remove(); if(onNo) onNo(); });
  return ov;
}

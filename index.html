<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>★快樂的無盡密室之旅★</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --pink:#FF3D8C;
    --violet:#8C4DFF;
    --cyan:#34E4EA;
    --yellow:#FFD23F;
    --ink:#231933;
    --night:#1B1533;
    --night2:#241C3D;
    --bubble-dark:#33294f;
    --bubble-text:#f3eefc;
    --fog:#5c6b7a;
    --fog-text:#161b20;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0;
    padding:0;
    height:100%;
    font-family:"Noto Sans TC",sans-serif;
    background:
      radial-gradient(circle at 15% 20%, #2a1f4d 0%, transparent 45%),
      radial-gradient(circle at 85% 80%, #1f2b4d 0%, transparent 45%),
      #14101f;
    color:var(--ink);
    -webkit-tap-highlight-color:transparent;
  }
  #phone-wrap{
    min-height:100%;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px 12px;
  }
  #phone{
    position:relative;
    width:100%;
    max-width:410px;
    height:min(860px, 92vh);
    background:var(--night);
    border-radius:36px;
    overflow:hidden;
    box-shadow:0 30px 60px -20px rgba(0,0,0,.7), 0 0 0 8px #0c0916, 0 0 0 10px #2a2440;
    display:flex;
    flex-direction:column;
  }
  /* fake status bar */
  .statusbar{
    height:34px;
    flex:0 0 auto;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 22px;
    font-size:12px;
    font-weight:700;
    color:#fff;
    letter-spacing:.3px;
    z-index:5;
  }
  .statusbar .icons{display:flex;gap:5px;align-items:center;opacity:.9;}
  .notch{
    position:absolute;
    top:0;left:50%;
    transform:translateX(-50%);
    width:150px;height:22px;
    background:#0c0916;
    border-radius:0 0 16px 16px;
    z-index:6;
  }

  #screen{
    position:relative;
    flex:1 1 auto;
    overflow:hidden;
    display:flex;
    flex-direction:column;
  }

  /* ---------- HOME ---------- */
  .home{
    position:relative;
    height:100%;
    width:100%;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:38px;
    padding:20px 26px 26px;
    background:
      radial-gradient(circle at 20% 10%, rgba(255,61,140,.55), transparent 40%),
      radial-gradient(circle at 85% 15%, rgba(52,228,234,.4), transparent 45%),
      radial-gradient(circle at 50% 90%, rgba(140,77,255,.55), transparent 50%),
      linear-gradient(160deg,#1c1436,#241a44 60%, #170f2b);
    overflow:hidden;
  }
  .blob{
    position:absolute;
    border-radius:50%;
    filter:blur(2px);
    opacity:.55;
    animation:float 7s ease-in-out infinite;
  }
  .blob.b1{width:120px;height:120px;background:var(--pink);top:8%;left:-30px;animation-delay:0s;}
  .blob.b2{width:90px;height:90px;background:var(--cyan);bottom:22%;right:-20px;animation-delay:1.5s;}
  .blob.b3{width:60px;height:60px;background:var(--yellow);top:38%;right:18px;animation-delay:.7s;}
  @keyframes float{
    0%,100%{transform:translateY(0px);}
    50%{transform:translateY(-16px);}
  }
  .info-btn{
    position:absolute;
    top:16px;left:18px;
    width:40px;height:40px;
    border-radius:50%;
    background:rgba(255,255,255,.14);
    border:1.5px solid rgba(255,255,255,.5);
    color:#fff;
    font-size:19px;
    font-weight:900;
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;
    z-index:4;
    backdrop-filter:blur(4px);
  }
  .info-btn:active{transform:scale(.92);}

  .home-top{width:100%;text-align:center;z-index:2;}
  .badge{
    display:inline-block;
    font-size:12px;
    font-weight:700;
    color:#1c1436;
    background:var(--yellow);
    padding:5px 14px;
    border-radius:999px;
    margin-bottom:16px;
    letter-spacing:.5px;
    transform:rotate(-3deg);
  }
  .home-title{
    font-size:34px;
    font-weight:900;
    line-height:1.35;
    color:#fff;
    margin:0;
    text-shadow:0 4px 0 rgba(0,0,0,.25);
    text-align:center;
  }
  .home-title .title-star{
    background:linear-gradient(90deg,var(--pink),var(--yellow));
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
  }
  .home-title .title-text{
    color:#fff;
  }
  .home-sub{
    margin-top:14px;
    font-size:14px;
    color:#d9d2f5;
    line-height:1.6;
  }

  .home-mid{z-index:2;}
  .toilet-emoji{font-size:64px;filter:drop-shadow(0 8px 10px rgba(0,0,0,.35));}

  .home-bottom{width:100%;z-index:2;display:flex;flex-direction:column;align-items:center;gap:14px;}
  .btn{
    width:100%;
    max-width:280px;
    border:none;
    border-radius:999px;
    padding:16px 20px;
    font-family:inherit;
    font-size:16px;
    font-weight:700;
    cursor:pointer;
    text-align:center;
    transition:transform .12s ease, box-shadow .12s ease;
  }
  .btn:active{transform:scale(.96);}
  .btn-primary{
    color:#1c1436;
    background:linear-gradient(90deg,var(--yellow),#ffb3e0 60%, var(--pink));
    box-shadow:0 10px 22px -6px rgba(255,61,140,.55);
  }
  .btn-secondary{
    color:#fff;
    background:rgba(255,255,255,.08);
    border:1.5px solid rgba(255,255,255,.55);
  }
  .save-transfer-row{
    display:flex;
    justify-content:center;
    gap:10px;
    width:100%;
    max-width:280px;
    margin-top:-2px;
  }
  .save-transfer-btn{
    flex:1;
    border:1px solid rgba(255,255,255,.38);
    border-radius:999px;
    padding:8px 10px;
    background:rgba(255,255,255,.06);
    color:#d9d2f3;
    font-family:inherit;
    font-size:12px;
    font-weight:700;
    cursor:pointer;
  }
  .save-transfer-btn:active{transform:scale(.96);}
  .footer-links{
    position:absolute;
    left:0;
    right:0;
    bottom:31px;
    z-index:3;
    display:flex;
    justify-content:center;
    gap:18px;
    font-size:12px;
  }
  .home-version{
    position:absolute;
    left:0;
    right:0;
    bottom:8px;
    z-index:3;
    text-align:center;
    font-size:10px;
    letter-spacing:.5px;
    color:#b5acd8;
    pointer-events:none;
  }
  .footer-links a{
    color:#c9c1ec;
    text-decoration:none;
    border-bottom:1px dashed rgba(201,193,236,.6);
  }

  /* ---------- CHAT CHROME (used for naming / story) ---------- */
  .chat{
    position:relative;
    height:100%;
    display:flex;
    flex-direction:column;
    background:var(--night2);
  }
  .chat-header{
    flex:0 0 auto;
    display:flex;
    align-items:center;
    gap:10px;
    padding:10px 16px;
    background:#20182f;
    border-bottom:1px solid rgba(255,255,255,.06);
  }
  .chat-header.simple .chat-title{font-size:15.5px;}
  .examine-tag{
    flex:0 0 auto;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    min-height:34px;
    background:#20182f;
    color:#b7aee0;
    font-size:12px;
    font-weight:700;
    padding:8px 16px;
    box-sizing:border-box;
    border-bottom:1px solid rgba(255,255,255,.06);
  }
  .chat-avatar{
    width:34px;height:34px;border-radius:50%;
    background:linear-gradient(135deg,var(--violet),var(--pink));
    display:flex;align-items:center;justify-content:center;
    font-weight:900;color:#fff;font-size:15px;
    flex:0 0 auto;
  }
  .chat-title{color:#fff;font-weight:700;font-size:15px;line-height:1.2;}
  .chat-status{color:#8a81ad;font-size:11px;}
  .home-link-btn{
    margin-left:auto;
    border:none;
    border-radius:999px;
    padding:7px 14px;
    font-family:inherit;
    font-size:12.5px;
    font-weight:700;
    color:#fff;
    background:rgba(255,255,255,.1);
    border:1px solid rgba(255,255,255,.28);
    cursor:pointer;
    flex:0 0 auto;
  }
  .home-link-btn:active{transform:scale(.94);}

  .chat-body{
    flex:1 1 auto;
    overflow-y:auto;
    padding:18px 16px 10px;
    display:flex;
    flex-direction:column;
    gap:10px;
    -webkit-overflow-scrolling:touch;
  }
  .chat-body::-webkit-scrollbar{width:0;}

  .bubble{
    max-width:82%;
    padding:12px 15px;
    border-radius:18px;
    font-size:14.5px;
    line-height:1.65;
    animation:pop .28s ease;
    box-shadow:0 4px 10px rgba(0,0,0,.18);
  }
  @keyframes pop{
    from{opacity:0; transform:translateY(10px) scale(.97);}
    to{opacity:1; transform:translateY(0) scale(1);}
  }

  /* 畫面切換：舊氣泡先一起淡出，避免直接重繪造成閃爍 */
  #screen.switching .bubble,
  #screen.switching .scene-illustration,
  #screen.switching .tap-hint,
  #screen.switching .action-area > *{
    opacity:0 !important;
    transform:translateY(-4px) scale(.985);
    transition:opacity .18s ease, transform .18s ease;
    animation:none !important;
    pointer-events:none;
  }
  .bubble.left{
    align-self:flex-start;
    background:var(--bubble-dark);
    color:var(--bubble-text);
    border-bottom-left-radius:4px;
  }
  .bubble.right{
    align-self:flex-end;
    background:linear-gradient(90deg,var(--pink),var(--violet));
    color:#fff;
    border-bottom-right-radius:4px;
  }
  .bubble.player-answer{
    align-self:flex-end;
    background:#666;
    color:#fff;
    border-bottom-right-radius:4px;
  }
  .bubble.system{
    align-self:center;
    background:transparent;
    color:#8a81ad;
    font-size:12px;
    box-shadow:none;
  }
  .bubble.locations-bubble{
    width:fit-content;
    max-width:96%;
  }
  .theme-fog .bubble.locations-bubble{
    background:var(--bubble-dark);
    color:var(--bubble-text);
  }
  .locations-bubble{
    display:grid;
    grid-template-columns:repeat(3, max-content);
    justify-content:start;
    column-gap:18px;
    row-gap:14px;
  }
  .loc-line{
    color:#FF9224;
    font-weight:800;
    cursor:pointer;
    text-align:left;
    white-space:nowrap;
  }
  .loc-line:active{opacity:.6;}
  .bold-line{
    font-weight:800;
    letter-spacing:1px;
  }
  .image-bubble{
    text-align:center;
    padding:10px 10px 8px;
  }
  .image-bubble img{
    max-width:140px;
    width:100%;
    border-radius:10px;
    display:block;
    margin:0 auto;
    cursor:zoom-in;
  }
  .image-caption{
    margin-top:6px;
    font-size:11px;
    color:#8a81ad;
  }
  .theme-fog .image-caption{color:#5a6675;}
  .badend-banner{
    align-self:stretch;
    text-align:center;
    margin:14px 0 4px;
    padding:18px 16px;
    border-radius:18px;
    background:#000;
    border:none;
    width:100%;
    max-width:none;
  }
  .badend-title{
    color:#ff1f32;
    font-weight:900;
    font-size:17px;
    letter-spacing:1px;
  }
  .badend-hint{
    margin-top:7px;
    color:#8a8a8a;
    font-size:10.5px;
    font-weight:400;
  }
  .theme-fog .badend-hint{color:#8a8a8a;}
  .modal-overlay.lightbox-overlay{
    background:rgba(5,3,10,.9);
    padding:22px;
  }
  .lightbox-img{
    max-width:100%;
    max-height:100%;
    border-radius:14px;
    object-fit:contain;
  }

  .scene-illustration{
    align-self:stretch;
    width:calc(100% + 32px);
    margin:-18px -16px 8px;
  }
  .scene-illustration img,
  .scene-illustration svg{
    width:100%;
    height:auto;
    display:block;
    object-fit:contain;
  }

  .tap-hint{
    flex:0 0 auto;
    text-align:center;
    font-size:12px;
    color:#8a81ad;
    padding:6px 0 14px;
    animation:blink 1.6s infinite;
  }
  @keyframes blink{
    0%,100%{opacity:.35;}
    50%{opacity:1;}
  }

  .hint-fab{
    position:absolute;
    right:14px;
    bottom:14px; /* 由 positionHintFab() 動態移到淺灰聊天區右下角 */
    width:46px;
    height:46px;
    min-width:46px;
    padding:0;
    border-radius:50%;
    border:1px solid rgba(255,255,255,.28);
    background:linear-gradient(135deg,var(--violet),var(--pink));
    color:#fff;
    font-family:inherit;
    font-size:0;
    font-weight:900;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    box-shadow:0 6px 18px rgba(0,0,0,.32);
    z-index:30;
  }
  .hint-fab::before{
    content:'?';
    font-size:22px;
    line-height:1;
  }
  .hint-fab:active{transform:scale(.92);}

  .action-area{
    flex:0 0 auto;
    padding:10px 16px 18px;
    display:flex;
    flex-direction:column;
    gap:10px;
  }
  .chip-row{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    justify-content:center;
  }
  .chip{
    border:none;
    border-radius:999px;
    padding:10px 18px;
    font-family:inherit;
    font-size:14px;
    font-weight:700;
    color:#1c1436;
    background:linear-gradient(90deg,var(--cyan),var(--yellow));
    cursor:pointer;
    box-shadow:0 6px 14px -4px rgba(52,228,234,.5);
    animation:pop .3s ease;
  }
  .chip:active{transform:scale(.95);}
  .chip.small{
    background:rgba(255,255,255,.08);
    color:#e9e4fb;
    border:1px solid rgba(255,255,255,.28);
    box-shadow:none;
    font-size:13px;
    padding:9px 14px;
  }

  .name-input-row{
    display:flex;
    flex-wrap:nowrap;
    align-items:stretch;
    gap:8px;
    animation:pop .3s ease;
  }
  .name-input-row input{
    flex:1 1 0;
    min-width:0;
    border-radius:999px;
    border:1.5px solid rgba(255,255,255,.3);
    background:rgba(255,255,255,.06);
    color:#fff;
    padding:12px 16px;
    font-size:14.5px;
    font-family:inherit;
    outline:none;
  }
  .name-input-row input::placeholder{color:#8a81ad;}
  .name-input-row button{
    flex:0 0 auto;
    white-space:nowrap;
    border:none;
    border-radius:999px;
    padding:0 20px;
    font-weight:700;
    font-family:inherit;
    background:linear-gradient(90deg,var(--pink),var(--violet));
    color:#fff;
    cursor:pointer;
  }
  .name-input-row .input-confirm-btn{
    border:none;
    border-radius:999px;
    padding:0 20px;
    font-weight:700;
    font-family:inherit;
    background:linear-gradient(90deg,var(--pink),var(--violet));
    color:#fff;
    cursor:pointer;
    box-shadow:none;
  }
  .name-input-row .input-back-btn{
    border:1px solid rgba(255,255,255,.28);
    border-radius:999px;
    padding:0 20px;
    font-weight:700;
    font-family:inherit;
    background:rgba(255,255,255,.08);
    color:#e9e4fb;
    cursor:pointer;
    box-shadow:none;
  }

  /* wake scene fog theme */
  .theme-fog .chat-body{background:linear-gradient(180deg, var(--fog), #4a5866);}
  .theme-fog.danger-red .chat-body{
    background:linear-gradient(180deg, #351417, #6d171d);
    transition:background 1.25s ease;
  }
  .danger-countdown{
    width:min(360px, calc(100% - 28px));
    height:7px;
    margin:8px auto 0;
    border-radius:999px;
    overflow:hidden;
    background:rgba(255,255,255,.16);
  }
  .danger-countdown > span{
    display:block;
    width:100%;
    height:100%;
    background:#b3262e;
    transform-origin:left center;
    animation:dangerCountdown 2s linear forwards;
  }
  @keyframes dangerCountdown{to{transform:scaleX(0);}}
  .theme-fog .bubble.left{background:rgba(255,255,255,.85); color:var(--fog-text);}
  .theme-fog .chat-body{color:var(--fog-text);}

  /* ---------- FALLING SCREEN ---------- */
  .falling{
    height:100%;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#000;
    color:#eee;
    text-align:center;
    padding:0 30px;
    font-size:17px;
    letter-spacing:.5px;
    cursor:pointer;
  }

  /* ---------- LEVEL SELECT ---------- */
  .level-select{
    height:100%;
    display:flex;
    flex-direction:column;
    background:var(--night2);
    padding:18px 18px 24px;
  }
  .ls-header{display:flex;align-items:center;gap:10px;margin-bottom:18px;}
  .back-btn{
    width:34px;height:34px;border-radius:50%;
    background:rgba(255,255,255,.08);
    border:none;color:#fff;font-size:16px;
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;
  }
  .ls-title{color:#fff;font-weight:900;font-size:18px;}
  .level-card{
    position:relative;
    display:flex;align-items:center;gap:12px;
    background:rgba(255,255,255,.06);
    border:1px solid rgba(255,255,255,.1);
    border-radius:16px;
    padding:14px 16px;
    margin-bottom:12px;
    cursor:pointer;
  }
  .level-card.locked{opacity:.45; cursor:not-allowed;}
  .level-num{
    width:42px;height:42px;border-radius:12px;
    background:linear-gradient(135deg,var(--pink),var(--violet));
    color:#fff;font-weight:900;font-size:16px;
    display:flex;align-items:center;justify-content:center;
    flex:0 0 auto;
  }
  .level-card.locked .level-num{background:#3a3355;}
  .level-info{flex:1; min-width:0;}
  .level-name{color:#fff;font-weight:700;font-size:14.5px;}
  .level-desc{color:#a89fcf;font-size:12px;margin-top:2px;}
  .clear-progress-btn{
    flex:0 0 auto;
    border:1px solid rgba(255,255,255,.25);
    background:rgba(255,255,255,.06);
    color:#d8d1f0;
    font-size:11px;
    font-weight:700;
    font-family:inherit;
    padding:7px 12px;
    border-radius:999px;
    cursor:pointer;
  }
  .clear-progress-btn:active{transform:scale(.94);}
  .ending-list-btn{
    flex:0 0 auto; border:1px solid rgba(255,255,255,.25);
    background:rgba(255,255,255,.10); color:#fff; font-size:11px; font-weight:800;
    font-family:inherit; padding:7px 12px; border-radius:999px; cursor:pointer;
  }
  .ending-list-btn:active{transform:scale(.94);}
  .level-actions{display:flex;gap:7px;align-items:center;flex:0 0 auto;}
  .level-card.cleared{
    background:rgba(255,213,74,.13);
    border-color:rgba(255,213,74,.5);
  }
  .level-card.cleared .level-num{
    background:linear-gradient(135deg,#ffcf3f,#ff9f1c); color:#2a1a00;
  }
  .level-card.cleared .level-name{color:#ffe27a;}
  .cleared-badge{
    position:absolute; top:8px; right:8px;
    width:24px; height:24px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    background:linear-gradient(135deg,#ffd84d,#ff9f1c);
    color:#2a1a00; font-size:15px; font-weight:900;
    box-shadow:0 2px 8px rgba(0,0,0,.28);
    pointer-events:none;
  }
  .ending-modal-list{text-align:left;margin:12px 0 4px;display:flex;flex-direction:column;gap:10px;}
  /* 結局／道具視窗最多顯示五條，超過後僅清單區滾動，標題與底部按鈕不移動。 */
  .collection-modal-card{display:flex;flex-direction:column;min-height:0;max-height:calc(92vh - 70px);}
  .ending-modal-list,.multi-inventory-list,.inventory-popup-list{
    min-height:0;
    flex:0 1 auto;
    max-height:min(var(--five-row-height, 410px), calc(92vh - 250px));
    overflow-y:auto;
    overscroll-behavior:contain;
    scrollbar-width:thin;
    scrollbar-color:#c4a7ee #211a33;
    padding-right:7px;
  }
  .ending-modal-list.has-overflow,.multi-inventory-list.has-overflow,.inventory-popup-list.has-overflow{overflow-y:scroll;}
  .ending-modal-list::-webkit-scrollbar,.multi-inventory-list::-webkit-scrollbar,.inventory-popup-list::-webkit-scrollbar{width:8px;}
  .ending-modal-list::-webkit-scrollbar-track,.multi-inventory-list::-webkit-scrollbar-track,.inventory-popup-list::-webkit-scrollbar-track{background:#211a33;border-radius:999px;}

      <div class="modal-card">
        <p class="modal-title">遊戲說明</p>
        <p class="modal-text">歡迎來到無盡的密室逃脫世界！
這款遊戲劇情始終如一簡單、解謎則是會隨著進度越來越難！

部分謎題需輸入文字，必須使用「繁體中文」才能順利進行。
如發現bug或改進建議，歡迎來信回報。
yoyo168yes@gmail.com</p>
        <button class="modal-btn" id="closeInfo">了解</button>

<script>
const screenEl = document.getElementById('screen');
const infoModal = document.getElementById('infoModal');

document.getElementById('closeInfo').addEventListener('click', ()=> infoModal.classList.remove('open'));

// live clock for the fake status bar, small nice touch
function tickClock(){
  const d = new Date();
  const h = d.getHours().toString().padStart(2,'0');
  const m = d.getMinutes().toString().padStart(2,'0');
  document.getElementById('clock').textContent = h+':'+m;
}
tickClock(); setInterval(tickClock, 15000);

function getName(){ try{return localStorage.getItem('erc_playerName')||'';}catch(e){return '';} }
function setName(n){ try{localStorage.setItem('erc_playerName', n);}catch(e){} }
const LAST_LEVEL_KEY = 'erc_last_entered_level';
function getLastEnteredLevel(){
  try{return localStorage.getItem(LAST_LEVEL_KEY) || 'chapter1';}catch(e){return 'chapter1';}
}
function setLastEnteredLevel(levelId){
  try{localStorage.setItem(LAST_LEVEL_KEY, levelId);}catch(e){}
}
function enterChapter1FromMenu(){
  setLastEnteredLevel('chapter1');
  if(!getName()){
    fadeTo(renderNaming);
  } else if(rejectedStart){
    fadeTo(renderReturnAfterReject);
  } else {
    fadeTo(()=>{
      renderScene('wake');
      confirmPopup('是否直接前往調查畫面？',
        ()=> fadeTo(renderInvestigate),
        ()=>{}
      );
    });
  }
}
function enterChapter2FromMenu(){
  setLastEnteredLevel('chapter2');
  if(chapter2InvestigationUnlocked){
    fadeTo(()=>{
      renderChapter2Start();
      confirmPopup('是否直接前往調查畫面？',
        ()=> fadeTo(()=>renderChapter2Investigate(true)),
        ()=>{}
      );
    });
  }else{
    fadeTo(renderChapter2Start);
  }
}

let isSwitchingScreen = false;
function fadeTo(renderFn){
  if(isSwitchingScreen) return;
  isSwitchingScreen = true;

  // 先讓目前畫面中的所有氣泡／操作元件一起消失。
  // 不先清空 screen，因此切換途中不會出現背景閃白或瞬間空畫面。
  screenEl.classList.add('switching');

  setTimeout(()=>{
    renderFn();
    screenEl.classList.remove('switching');
    isSwitchingScreen = false;
  }, 190);
}

/* ---------------- SAVE EXPORT / IMPORT ---------------- */
let isImportingSave = false; // 匯入期間禁止舊的記憶體狀態覆寫剛匯入的 localStorage
function getExportableSaveData(){
  // 本遊戲所有永久存檔都使用 erc_ 前綴；逐鍵完整複製原始值，
  // 包含玩家名、最後進入關卡、各關卡進度、道具、結局與破關狀態。
  const data = {};
  try{
    for(let i=0;i<localStorage.length;i++){
      const key = localStorage.key(i);
      if(key && key.startsWith('erc_')) data[key] = localStorage.getItem(key);
    }
  }catch(e){}
  return data;
}

function downloadGameSave(){
  // 匯出前強制把目前記憶體狀態完整同步到 localStorage。
  try{
    saveChapter1Progress();
    saveChapter2Progress();
    // 玩家名與最後關卡本來就是即時寫入 localStorage；此處保留其原始值。
  }catch(e){}
  const data = getExportableSaveData();
  const payload = {
    game: '★快樂的無盡密室之旅★',
    format: 'erc-save',
    version: 2,
    exportedAt: new Date().toISOString(),
    data: data,
    summary: {
      playerName: data.erc_playerName || '',
      lastLevel: data.erc_last_entered_level || 'chapter1',
      chapter1: data.erc_chapter1_progress_v1 ? JSON.parse(data.erc_chapter1_progress_v1) : null,
      chapter2: data.erc_chapter2_progress_v1 ? JSON.parse(data.erc_chapter2_progress_v1) : null
    }
  };
  const blob = new Blob([JSON.stringify(payload, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const d = new Date();
  const pad = n => String(n).padStart(2,'0');
  a.href = url;
  a.download = `無盡密室之旅_存檔_${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}_${pad(d.getHours())}${pad(d.getMinutes())}.json`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 1000);
}

function handleGameSaveUpload(e){
  const input = e.currentTarget;
  const file = input.files && input.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = ()=>{
    try{
      const payload = JSON.parse(String(reader.result || ''));
      if(!payload || payload.format !== 'erc-save' || !payload.data || typeof payload.data !== 'object' || Array.isArray(payload.data)){
        throw new Error('invalid save');
      }
      const entries = Object.entries(payload.data);
      if(entries.some(([key,value]) => !key.startsWith('erc_') || typeof value !== 'string')) throw new Error('invalid data');
      confirmPopup('上傳存檔會覆蓋目前的遊玩進度，確定要繼續嗎？', ()=>{
        try{
          // 匯入時先停用自動存檔。否則重新載入前，setInterval / beforeunload
          // 可能把「清除進度後仍留在記憶體中的舊狀態」寫回去，蓋掉剛匯入的存檔。
          isImportingSave = true;
          // 只清除本遊戲自己的資料，不影響同網域其他內容。
          const oldKeys=[];
          for(let i=0;i<localStorage.length;i++){
            const key=localStorage.key(i);
            if(key && key.startsWith('erc_')) oldKeys.push(key);
          }
          oldKeys.forEach(key=>localStorage.removeItem(key));
          entries.forEach(([key,value])=>localStorage.setItem(key,value));
          alert('存檔上傳成功！即將重新載入遊戲。');
          location.reload();
        }catch(err){
          alert('無法寫入存檔，請確認瀏覽器允許儲存網站資料。');
        }
      }, ()=>{});
    }catch(err){
      alert('存檔格式不正確，請選擇由本遊戲「下載存檔」產生的 JSON 檔案。');
    }finally{
      input.value='';
    }
  };
  reader.onerror = ()=>{ alert('讀取存檔失敗，請重新選擇檔案。'); input.value=''; };
  reader.readAsText(file, 'utf-8');
}

/* ---------------- HOME ---------------- */
function renderHome(){
  screenEl.innerHTML = `

        <h1 class="home-title">快樂的<br><span class="title-star">★</span><span class="title-text">無盡密室之旅</span><span class="title-star">★</span></h1>
        <p class="home-sub">劇情不夠、解謎來湊，挑戰你的密室腦！</p>
      </div>
      <div class="home-bottom">
        <button class="btn btn-primary" id="startBtn">開始挑戰</button>
        <button class="btn btn-secondary" id="levelBtn">選擇關卡</button>
        <div class="save-transfer-row">
          <button class="save-transfer-btn" id="downloadSaveBtn">下載存檔</button>
          <button class="save-transfer-btn" id="uploadSaveBtn">上傳存檔</button>
          <input type="file" id="uploadSaveInput" accept="application/json,.json" hidden>
        </div>
        <div class="footer-links">
          <a href="https://portaly.cc/beifudianxiaoer" target="_blank" rel="noopener">關於作者</a>
          <a href="https://portaly.cc/beifudianxiaoer/support" target="_blank" rel="noopener">贊助我們</a>
        </div>

      </div>
    </div>
  `;
  document.getElementById('infoBtn').addEventListener('click', ()=> infoModal.classList.add('open'));
  document.getElementById('startBtn').addEventListener('click', ()=>{
    const lastLevel = getLastEnteredLevel();
    if(lastLevel === 'chapter2') enterChapter2FromMenu();
    else enterChapter1FromMenu();
  });
  document.getElementById('levelBtn').addEventListener('click', ()=> fadeTo(renderLevelSelect));
  document.getElementById('downloadSaveBtn').addEventListener('click', downloadGameSave);
  const uploadInput = document.getElementById('uploadSaveInput');
  document.getElementById('uploadSaveBtn').addEventListener('click', ()=> uploadInput.click());
  uploadInput.addEventListener('change', handleGameSaveUpload);
}

/* 保留結局蒐集的獨立存檔；清除關卡進度時不會刪除這兩個 erc_ 鍵。 */
const CHAPTER1_ENDING_ARCHIVE_KEY = 'erc_chapter1_endings_archive_v1';
const CHAPTER2_ENDING_ARCHIVE_KEY = 'erc_chapter2_endings_archive_v1';
const LEGACY_BOMB_ENDING = 'BE：通往天國的倒數計時';
const CANONICAL_BOMB_ENDING = 'BAD END：通往天國的倒數計時';
function canonicalEndingTitle(title){ return title === LEGACY_BOMB_ENDING ? CANONICAL_BOMB_ENDING : title; }
function readEndingArchive(key){
  try{
    const data=JSON.parse(localStorage.getItem(key)||'null');
    return data && typeof data === 'object' && !Array.isArray(data)
      ? {endings:Array.isArray(data.endings)?data.endings:[],goodCollected:!!data.goodCollected}
      : {endings:[],goodCollected:false};
  }catch(e){return {endings:[],goodCollected:false};}
}
function writeEndingArchive(key, archive){
  try{
    const serialized=JSON.stringify(archive);
    if(localStorage.getItem(key)!==serialized) localStorage.setItem(key,serialized);
  }catch(e){}
}
/* 清單高度以已顯示的前五條實際高度計算，較長的提示不會截斷。 */
function limitCollectionListToFive(overlay){
  const list=overlay.querySelector('.ending-modal-list,.multi-inventory-list,.inventory-popup-list');
  if(!list) return;
  const rows=Array.from(list.children);
  if(rows.length<=5) return;
  const style=getComputedStyle(list);
  const gap=parseFloat(style.rowGap || style.gap) || 0;
  const height=rows.slice(0,5).reduce((sum,row)=>sum+row.getBoundingClientRect().height,0)+gap*4;
  list.style.setProperty('--five-row-height',`${Math.ceil(height)}px`);
  list.classList.add('has-overflow');
}

/* ---------------- LEVEL SELECT ---------------- */
function clearLevelProgress(levelId){
  // 每個關卡只清除自己的資料，避免影響其他關卡。
  if(levelId === 'chapter1'){
    syncChapter1EndingArchive();
    try{
      localStorage.removeItem('erc_playerName');
      localStorage.removeItem('erc_chapter1_progress_v1');
    }catch(err){}

/* ---------------- NAMING (chat bubble progressive reveal) ---------------- */
function renderNaming(){
  screenEl.innerHTML = `
    <div class="chat">
      ${chatHeader('？？？','正在輸入…')}
      <div class="chat-body" id="chatBody"></div>
      <div class="tap-hint" id="tapHint">請點擊畫面繼續</div>
      <div class="action-area" id="actionArea"></div>
    </div>
  `;
  body = document.getElementById('chatBody');
  hint = document.getElementById('tapHint');
  action = document.getElementById('actionArea');
  const lines = ['歡迎！','你叫什麼名字？'];
  let idx = 0;

  function reveal(){
    if(idx < lines.length){
      addBubble(body, lines[idx], 'left');
      idx++;
      body.scrollTop = body.scrollHeight;
      if(idx === lines.length){
        hint.style.display = 'none';
        action.innerHTML = `
          <div class="name-input-row">
            <input id="nameInput" type="text" maxlength="12" placeholder="輸入你的名字…">
            <button id="confirmName">確認</button>
          </div>`;
        document.getElementById('confirmName').addEventListener('click', submitName);
        document.getElementById('nameInput').addEventListener('keydown', (e)=>{
          if(e.key === 'Enter') submitName();
        });
      }
    }
  }
  document.querySelector('.chat').addEventListener('click', (e)=>{
    if(idx < lines.length && !e.target.closest('.name-input-row')) reveal();
  });
  reveal();

  function submitName(){
    const input = document.getElementById('nameInput');
    const val = (input.value||'').trim();
    if(!val){ input.focus(); return; }
    addBubble(body, val, 'right');
    action.innerHTML = '';
    body.scrollTop = body.scrollHeight;

    if(val === '店小二' || val === '北府店小二'){
      setTimeout(()=>{
        stepRunner = runSteps([
          '不准冒充作者！',
          ()=>{ fadeTo(renderNaming); }
        ]);
      }, 350);
      return;
    }

    setName(val);
    const nameReply = val === '陳秋虎'
      ? '是、是傳說中的台灣阿虎嗎？！'
      : val === '李少宏'
        ? '為什麼你會出現在這裡呢？'
        : `你叫${val}啊！`;
    setTimeout(()=>{
      stepRunner = runSteps([
        nameReply,
        '你喜歡密室逃脫嗎？',
        (advance)=>{
          action.innerHTML = `
            <div class="chip-row">
              <button class="chip" id="likeBtn">喜歡</button>
              <button class="chip" id="dislikeBtn">不喜歡</button>
            </div>`;
          document.getElementById('likeBtn').addEventListener('click', ()=>{
            addBubble(body, '喜歡', 'right');
            action.innerHTML = '';
            scrollDown();
            stepRunner.extend([
              '我就知道！',
              '不然你就不會來這裡了對吧～',
              '現在就讓你體驗一下',
              '無盡的密室之旅吧……',
              ()=>{ fadeTo(renderFalling); }
            ]);
          });
          document.getElementById('dislikeBtn').addEventListener('click', ()=>{
            addBubble(body, '不喜歡', 'right');
            action.innerHTML = '';
            scrollDown();
            stepRunner.extend([
              '不喜歡？',
              '那你來這裡幹嘛？',
              ()=>{ rejectedStart = true; fadeTo(renderHome); }
            ]);
          });
        }
      ]);
    }, 500);
  }
}

  const before = chapter2Inventory.length;
  chapter2Inventory = chapter2Inventory.filter(id => !(used.includes(id) && CHAPTER2_CONSUMABLE_ITEMS.has(id)));
  if(chapter2Inventory.length !== before) saveChapter2Progress();
}

function syncChapter2EndingArchive(){
  const endings=new Set(chapter2EndingArchive.endings.map(canonicalEndingTitle).filter(t=>Object.hasOwn(CHAPTER2_ENDINGS,t)));
  chapter2Endings.forEach(t=>{const canonical=canonicalEndingTitle(t);if(Object.hasOwn(CHAPTER2_ENDINGS,canonical)) endings.add(canonical);});
  chapter2EndingArchive={
    endings:[...endings],
    goodCollected:chapter2EndingArchive.goodCollected || chapter2Cleared || chapter2Endings.includes('GOOD END：發現生路')
  };
  writeEndingArchive(CHAPTER2_ENDING_ARCHIVE_KEY,chapter2EndingArchive);
}

function scrollDown(){
  const chatBody = (typeof body !== 'undefined' && body) ? body : document.getElementById('chatBody');
  if(!chatBody) return;
  requestAnimationFrame(()=>{
    chatBody.scrollTop = chatBody.scrollHeight;
    requestAnimationFrame(()=>{ chatBody.scrollTop = chatBody.scrollHeight; });
  });
}

/* 只要聊天區新增對話、劇情、圖片或按鈕，就自動捲到最底部 */
const autoScrollObserver = new MutationObserver((mutations)=>{
  const chatBody = document.getElementById('chatBody');
  if(!chatBody) return;
  const hasNewContent = mutations.some(m =>
    m.type === 'childList' && m.addedNodes && m.addedNodes.length > 0
  );
  if(hasNewContent){
    requestAnimationFrame(()=>{
      chatBody.scrollTop = chatBody.scrollHeight;
      requestAnimationFrame(()=>{ chatBody.scrollTop = chatBody.scrollHeight; });
    });
  }
});
autoScrollObserver.observe(document.getElementById('screen'), {childList:true, subtree:true});

function buildExamineScreen(spot){
  screenEl.innerHTML = `
    <div class="chat theme-fog">
      ${sceneHeader(CHAPTER_TITLE)}
      <div class="examine-tag">正在調查：${spot}</div>
      <div class="chat-body" id="chatBody"></div>
      <div class="tap-hint" id="tapHint">請點擊畫面繼續</div>
      <div class="action-area" id="actionArea"></div>
    </div>
  `;
  bindHomeLinkBtn();
  body = document.getElementById('chatBody');
  hint = document.getElementById('tapHint');
  action = document.getElementById('actionArea');
  sinkStage = null;
  let steps;
  if(spot === '牆壁') steps = wallSteps();
  else if(spot === '天花板') steps = ceilingSteps();
  else if(spot === '浴缸') steps = bathtubSteps();
  else if(spot === '洗手臺') steps = sinkSteps();
  else if(spot === '置物架') steps = shelfSteps();
  else if(spot === '馬桶') steps = toiletSteps();
  else if(spot === '門鎖') steps = doorLockSteps();
  else if(spot === '牆角') steps = cornerSteps();
  else if(spot === '置物櫃底層') steps = cabinetBottomSteps();
  else if(spot === '馬桶後面') steps = behindToiletSteps();
  else steps = genericSteps(spot);
  stepRunner = runSteps(steps);
}

/* 通用的逐行點擊顯示引擎：陣列項目可以是文字（一行對話）或函式（自訂動作，例如彈窗、切換底部按鈕） */
let activeEnterAdvance = null;
document.addEventListener('keydown', (e)=>{
  if(e.key !== 'Enter' || e.repeat || !activeEnterAdvance) return;
  if(document.querySelector('.popup-overlay, .lightbox')) return;
  const tag = (document.activeElement && document.activeElement.tagName || '').toLowerCase();
  if(tag === 'input' || tag === 'textarea' || tag === 'button' || tag === 'a') return;
  // 只有純劇情閱讀、沒有選項／操作按鈕時，Enter 才等同點擊畫面。
  const actionArea = document.getElementById('actionArea');
  if(actionArea && actionArea.querySelector('button, input, a')) return;
  e.preventDefault();
  const fn = activeEnterAdvance;
  activeEnterAdvance = null;
  fn();
});

function runSteps(steps){
  let i = 0;
  let waitingForClick = false;
  const chatEl = document.querySelector('.chat');
  function advance(){
    if(i >= steps.length){ hint.style.display = 'none'; waitingForClick = false; activeEnterAdvance = null; return; }
    const step = steps[i++];
    if(typeof step === 'function'){
      hint.style.display = 'none';
      waitingForClick = false;
      activeEnterAdvance = null;
      step(advance);
    } else if(typeof step === 'object'){
      if(step.fullImage){
        addFullWidthImage(step.fullImage, step.alt || '圖片');
      } else if(step.image){
        addImageBubble(step.image, step.caption);
      } else if(step.character){
        addCharacterBubble(step.character, step.text);
      } else if(step.bold){
        addBoldChapter2Bubble(step.text);
      } else {
        addBubble(body, step.text, step.type || 'left');
      }
      scrollDown();
      waitingForClick = i < steps.length;
      activeEnterAdvance = waitingForClick ? advance : null;
      hint.style.display = waitingForClick ? 'block' : 'none';
    } else {
      addBubble(body, step, 'left');
      scrollDown();
      waitingForClick = i < steps.length;
      activeEnterAdvance = waitingForClick ? advance : null;
      hint.style.display = waitingForClick ? 'block' : 'none';
    }
  }
  function clickHandler(e){
    // 對話／行動按鈕本身的點擊只負責送出玩家氣泡，不能同一次點擊又推進下一句。
    // 按鈕 handler 可能會立刻從 DOM 移除按鈕，因此不能只判斷其父層 .chip-row；
    // 直接判斷事件目標本身是否為互動控制項，避免事件冒泡造成一次跳出兩個氣泡。
    if(e.target.closest('button, input, textarea, select, a, .home-link-btn, .name-input-row')) return;
    if(waitingForClick){ waitingForClick = false; activeEnterAdvance = null; advance(); }
  }
  chatEl.addEventListener('click', clickHandler);
  advance();
  return {
    extend(moreSteps){
      steps.push(...moreSteps);
      advance();
    },
    // 用於玩家按下對話選項後：玩家氣泡先出現，下一句必須再次點擊畫面才顯示。
    queue(moreSteps){
      steps.push(...moreSteps);
      waitingForClick = steps.length > i;
      activeEnterAdvance = waitingForClick ? advance : null;
      hint.style.display = waitingForClick ? 'block' : 'none';
    },
    // 提示按鈕專用：按下提示的當下就顯示第一句，後續仍一次點擊一個氣泡。
    queueImmediate(moreSteps){
      steps.push(...moreSteps);
      waitingForClick = false;
      activeEnterAdvance = null;
      advance();
    },
    reveal(){
      if(waitingForClick){ waitingForClick=false; activeEnterAdvance=null; advance(); }
    },
    get waiting(){ return waitingForClick; }
  };
}

function showChapter2Inventory(onUse, inspectOnly=false){
  const phone = document.getElementById('phone');
  const ov = document.createElement('div');
  ov.className = 'modal-overlay open';
  const selected = new Set();
  const items = chapter2Inventory.length
    ? chapter2Inventory.map(id=>`<button class="multi-inventory-item" data-item="${id}">${ITEM_NAMES[id] || id}</button>`).join('')
    : '<div class="ending-empty">目前沒有任何道具。</div>';
  const guide = inspectOnly ? '點擊道具可查看說明' : '可同時選擇多個道具，再按下「使用」。';
  const buttons = inspectOnly
    ? ''
    : `<div style="display:flex;gap:8px;"><button class="modal-btn" id="chapter2UseItems">使用</button><button class="modal-btn" id="chapter2CloseItems" style="background:rgba(255,255,255,.12);color:#fff;">關閉</button></div>`;
  ov.innerHTML = `<div class="modal-card collection-modal-card"><p class="modal-title">道具欄</p><p class="modal-text" style="font-size:12px;">${guide}</p><div class="multi-inventory-list">${items}</div>${buttons}</div>`;
  phone.appendChild(ov);
  limitCollectionListToFive(ov);
  ov.querySelectorAll('.multi-inventory-item').forEach(btn=>btn.addEventListener('click', ()=>{
    const id=btn.dataset.item;
    if(inspectOnly){
      popup(ITEM_DESCRIPTIONS[id] || '目前沒有更多說明。');
      return;
    }
    if(selected.has(id)){ selected.delete(id); btn.classList.remove('selected'); }
    else { selected.add(id); btn.classList.add('selected'); }
  }));
  if(!inspectOnly){
    document.getElementById('chapter2UseItems').addEventListener('click', ()=>{ const chosen=[...selected]; ov.remove(); if(onUse) onUse(chosen); });
    document.getElementById('chapter2CloseItems').addEventListener('click', ()=>ov.remove());
  }else{
    // 調查畫面的道具欄比照第一關：不顯示「關閉」按鈕，點擊空白處即可關閉。
    ov.addEventListener('click', (e)=>{
      if(e.target === ov) ov.remove();
    });
  }
}

function ensureChapter2HintButton(customHandler){
  const chat = screenEl.querySelector('.chat');
  if(!chat) return;
  let btn = chat.querySelector('.hint-fab.chapter2-hint-fab');
  if(!btn){
    btn = document.createElement('button');
    btn.className = 'hint-fab chapter2-hint-fab';
    btn.setAttribute('aria-label','提示');
    btn.setAttribute('title','提示');
    btn.textContent = '提示';
    chat.appendChild(btn);
  }
  btn.onclick = (e)=>{
    e.stopPropagation();
    if(customHandler) customHandler();
    else popup('此處沒有提示！');
  };
  requestAnimationFrame(()=> positionHintFab(btn));
  const actionArea = chat.querySelector('.action-area');
  if(actionArea && !actionArea._chapter2HintObserver){
    const observer = new MutationObserver(()=>requestAnimationFrame(()=>positionHintFab(btn)));
    observer.observe(actionArea,{childList:true,subtree:true,attributes:true});
    actionArea._chapter2HintObserver = observer;
  }
}

function renderChapter2Investigate(showAllImmediately=false){
  screenEl.innerHTML=`<div class="chat theme-fog">${sceneHeader('第一章：兒童臥室')}<div class="chat-body" id="chatBody"></div><div class="tap-hint" id="tapHint">請點擊畫面繼續</div><div class="action-area" id="actionArea"></div></div>`;
  bindHomeLinkBtn();
  body=document.getElementById('chatBody'); hint=document.getElementById('tapHint'); action=document.getElementById('actionArea');
  ensureChapter2HintButton(chapter2InvestigationHint);

  function addChapter2LocationBubble(){
    const div=document.createElement('div');
    div.className='bubble left locations-bubble';
    div.innerHTML=getChapter2Spots().map(s=>`<div class="loc-line" data-ch2spot="${s}">${s}</div>`).join('');
    body.appendChild(div); scrollDown();
    div.querySelectorAll('.loc-line').forEach(el=>{
      el.addEventListener('click',(e)=>{
        e.stopPropagation();
        const spot=el.dataset.ch2spot;
        if(chapter2NoWayMode){
          fadeTo(()=>renderChapter2NoWay(spot));
          return;
        }
        if(spot==='大門') fadeTo(renderChapter2MainDoor);
        else if(spot==='床') fadeTo(renderChapter2Bed);
        else if(spot==='窗戶') fadeTo(renderChapter2Window);
        else if(spot==='玩具箱') fadeTo(renderChapter2ToyBox);
        else if(spot==='書桌') fadeTo(renderChapter2Desk);
        else if(spot==='牆壁') fadeTo(renderChapter2Wall);
        else if(spot==='置物架') fadeTo(renderChapter2Shelf);
        else if(spot==='衣櫃') fadeTo(renderChapter2Wardrobe);
        else if(spot==='手機') fadeTo(renderChapter2Phone);
      });
    });
  }
  function showOverviewInventory(){
    action.innerHTML = `<div class="chip-row"><button class="chip" id="chapter2OverviewInventoryBtn">道具欄</button></div>`;
    document.getElementById('chapter2OverviewInventoryBtn').addEventListener('click',(e)=>{
      e.stopPropagation(); showChapter2Inventory(null, true);
    });
    const hintBtn=screenEl.querySelector('.chapter2-hint-fab');
    if(hintBtn) requestAnimationFrame(()=>positionHintFab(hintBtn));
  }

  // 調查總覽不屬於逐句劇情：不論是首次切換、直接前往，或從任何調查地點返回，
  // 都一次完整顯示所有總覽氣泡與地點選單。
  addBubble(body,'以下為可以調查的地方：','left');
  addChapter2LocationBubble();
  addBubble(body,'要調查哪裡呢？','left');
  showOverviewInventory();
  hint.style.display='none';
  scrollDown();
  stepRunner=runSteps([]);
}

let chapter2PhoneBombState = null;

function clearChapter2PhoneBombTimer(){
  if(chapter2PhoneBombState && chapter2PhoneBombState.interval){
    clearInterval(chapter2PhoneBombState.interval);
    chapter2PhoneBombState.interval = null;
  }
}

function formatChapter2BombTime(ms){
  const total = Math.max(0, Math.ceil(ms / 1000));
  const m = Math.floor(total / 60);
  const s = String(total % 60).padStart(2,'0');
  return `${m}：${s}`;
}

function updateChapter2BombTimerDisplay(){
  if(!chapter2PhoneBombState || !chapter2PhoneBombState.timerEl) return;
  const remaining = chapter2PhoneBombState.paused
    ? chapter2PhoneBombState.remainingMs
    : Math.max(0, chapter2PhoneBombState.deadline - Date.now());

  chapter2PhoneBombState.remainingMs = remaining;
  chapter2PhoneBombState.timerEl.textContent = formatChapter2BombTime(remaining);

  if(remaining <= 0 && !chapter2PhoneBombState.finished){
    chapter2PhoneBombTimeout();
  }
}

function startChapter2BombTimer(timerEl, durationMs=60000){
  clearChapter2PhoneBombTimer();
  chapter2PhoneBombState = {
    timerEl,
    remainingMs: durationMs,
    deadline: Date.now() + durationMs,
    paused: false,
    finished: false,
    sequence: [],
    interval: null
  };
  updateChapter2BombTimerDisplay();
  chapter2PhoneBombState.interval = setInterval(updateChapter2BombTimerDisplay, 200);
}

function pauseChapter2BombTimer(){
  if(!chapter2PhoneBombState || chapter2PhoneBombState.finished || chapter2PhoneBombState.paused) return;
  chapter2PhoneBombState.remainingMs = Math.max(0, chapter2PhoneBombState.deadline - Date.now());
  chapter2PhoneBombState.paused = true;
  clearChapter2PhoneBombTimer();
  updateChapter2BombTimerDisplay();
}

function resumeChapter2BombTimer(){
  if(!chapter2PhoneBombState || chapter2PhoneBombState.finished || !chapter2PhoneBombState.paused) return;
  chapter2PhoneBombState.paused = false;
  chapter2PhoneBombState.deadline = Date.now() + chapter2PhoneBombState.remainingMs;
  chapter2PhoneBombState.interval = setInterval(updateChapter2BombTimerDisplay, 200);
  updateChapter2BombTimerDisplay();
}

function finishChapter2BombTimer(){
  if(!chapter2PhoneBombState) return;
  chapter2PhoneBombState.finished = true;
  clearChapter2PhoneBombTimer();
}

function showChapter2PhonePatternLock(){
  hint.style.display='none';
  const card=document.createElement('div');
  card.className='phone-pattern-card';
  card.innerHTML=`<div class="phone-pattern-grid" id="chapter2PhonePatternGrid"><svg class="phone-pattern-lines" id="chapter2PhonePatternLines" aria-hidden="true"><polyline class="phone-pattern-polyline" id="chapter2PhonePatternPolyline" points=""></polyline></svg>${[1,2,3,4,5,6,7,8,9].map(n=>`<button class="phone-pattern-node" type="button" data-pattern-node="${n}" aria-label="${n}">${n}</button>`).join('')}</div>`;
  body.appendChild(card);
  scrollDown();

  const grid=card.querySelector('#chapter2PhonePatternGrid');
  const svg=card.querySelector('#chapter2PhonePatternLines');
  const polyline=card.querySelector('#chapter2PhonePatternPolyline');
  const sequence=[];

  function redrawPattern(){
    const w=grid.clientWidth || 1, h=grid.clientHeight || 1;
    svg.setAttribute('viewBox',`0 0 ${w} ${h}`);
    const pts=sequence.map(n=>{
      const node=grid.querySelector(`[data-pattern-node="${n}"]`);
      const x=node.offsetLeft + node.offsetWidth/2;
      const y=node.offsetTop + node.offsetHeight/2;
      return `${x},${y}`;
    });
    polyline.setAttribute('points',pts.join(' '));
  }
  function resetPattern(){
    sequence.length=0;
    card.querySelectorAll('.phone-pattern-node').forEach(n=>n.classList.remove('selected'));
    redrawPattern();
  }
  card.querySelectorAll('.phone-pattern-node').forEach(btn=>btn.addEventListener('click',(e)=>{
    e.stopPropagation();
    const n=btn.dataset.patternNode;
    if(sequence.includes(n)) return;
    sequence.push(n);
    btn.classList.add('selected');
    redrawPattern();
  }));

  action.innerHTML=`<div class="phone-pattern-actions"><button class="input-confirm-btn" id="chapter2PhonePatternConfirm">確定</button><button class="chip" id="chapter2PhonePatternReset">重設</button><button class="chip small" id="chapter2PhonePatternBack">返回</button></div>`;
  document.getElementById('chapter2PhonePatternReset').addEventListener('click',(e)=>{ e.stopPropagation(); resetPattern(); });
  document.getElementById('chapter2PhonePatternBack').addEventListener('click',(e)=>{ e.stopPropagation(); fadeTo(renderChapter2Investigate); });
  document.getElementById('chapter2PhonePatternConfirm').addEventListener('click',(e)=>{
    e.stopPropagation();
    const answer=sequence.join('');
    if(answer!=='321478965'){
      addBubble(body,'圖形密碼不對……','system');
      scrollDown();
      resetPattern();
      return;
    }
    card.remove();
    action.innerHTML='';
    chapter2PhoneSolved=true;
    saveChapter2Progress();
    ensureChapter2HintButton();
    stepRunner.queueImmediate([
      '解鎖了手機。',
      '裡面沒有任何資料，也沒有SIM卡……',
      '桌面中間是個「1：00」的倒數計時，底下有四個顏色的按鈕。',
      {character:'許文昌',text:'等等，這該不會根本不是手機，而是定時炸彈？！'},
      '難道必須依照正確順序按下按鈕才能停止嗎？',
      ()=>showChapter2PhoneBombControls()
    ]);
  });
  requestAnimationFrame(redrawPattern);
}

function enableChapter2BombScrollForwarding(){
  if(!action || action._bombScrollForwarding) return;
  action._bombScrollForwarding = true;

  action.addEventListener('wheel',(e)=>{
    if(!body) return;
    body.scrollTop += e.deltaY;
    e.preventDefault();
  },{passive:false});

  let lastTouchY = null;
  action.addEventListener('touchstart',(e)=>{
    if(e.touches && e.touches.length===1) lastTouchY = e.touches[0].clientY;
  },{passive:true});
  action.addEventListener('touchmove',(e)=>{
    if(lastTouchY===null || !body || !e.touches || e.touches.length!==1) return;
    const y = e.touches[0].clientY;
    body.scrollTop += (lastTouchY - y);
    lastTouchY = y;
    e.preventDefault();
  },{passive:false});
  action.addEventListener('touchend',()=>{ lastTouchY=null; },{passive:true});
  action.addEventListener('touchcancel',()=>{ lastTouchY=null; },{passive:true});
}

function showChapter2PhoneBombControls(resumeExisting=false){
  let timer = chapter2PhoneBombState && chapter2PhoneBombState.timerEl && document.body.contains(chapter2PhoneBombState.timerEl)
    ? chapter2PhoneBombState.timerEl
    : null;

  if(!timer){
    timer=document.createElement('div');
    timer.className='phone-bomb-timer';
    timer.textContent='1：00';
    body.appendChild(timer);
    scrollDown();
  }

  if(!resumeExisting || !chapter2PhoneBombState){
    startChapter2BombTimer(timer, 60000);
  }else{
    // 提示結束後把原本的計時器移回最新對話下方；數字維持暫停前的剩餘時間。
    body.appendChild(timer);
    chapter2PhoneBombState.timerEl = timer;
    resumeChapter2BombTimer();
  }

  ensureChapter2HintButton(chapter2PhoneBombHint);
  enableChapter2BombScrollForwarding();

  action.innerHTML=`<div class="phone-color-row" id="chapter2PhoneColorRow">
    <button class="phone-color-btn pink" data-bomb-color="粉" aria-label="粉紅" title="粉紅"></button>
    <button class="phone-color-btn purple" data-bomb-color="紫" aria-label="紫色" title="紫色"></button>
    <button class="phone-color-btn green" data-bomb-color="綠" aria-label="綠色" title="綠色"></button>
    <button class="phone-color-btn blue" data-bomb-color="藍" aria-label="藍色" title="藍色"></button>
  </div>
  <div class="chip-row"><button class="chip" id="chapter2PhoneInventoryBtn">道具欄</button></div>`;

  const row=document.getElementById('chapter2PhoneColorRow');

  action.querySelectorAll('.phone-color-btn').forEach(btn=>btn.addEventListener('click',(e)=>{
    e.stopPropagation();
    if(!chapter2PhoneBombState || chapter2PhoneBombState.finished || chapter2PhoneBombState.paused) return;

    const color=btn.dataset.bombColor;
    chapter2PhoneBombState.sequence.push(color);
    btn.classList.add('pressed');
    setTimeout(()=>btn.classList.remove('pressed'),180);

    if(chapter2PhoneBombState.sequence.length < 4) return;

    const answer=chapter2PhoneBombState.sequence.join('');
    if(answer==='綠粉藍紫'){
      chapter2PhoneBombSuccess();
      return;
    }

    chapter2PhoneBombState.sequence=[];
    row.classList.remove('wrong');
    void row.offsetWidth;
    row.classList.add('wrong');
    setTimeout(()=>row.classList.remove('wrong'),380);
  }));

  document.getElementById('chapter2PhoneInventoryBtn').addEventListener('click',(e)=>{
    e.stopPropagation();
    showChapter2Inventory(chosen=>{ if(chosen.length) chapter2ShowUnusedItems(chosen); });
  });

  const hintBtn=screenEl.querySelector('.chapter2-hint-fab');
  if(hintBtn) requestAnimationFrame(()=>positionHintFab(hintBtn));
  requestAnimationFrame(()=>scrollDown());
}

/* ---- 將提示圓鈕固定在聊天區（淺灰底）右下角，不跟著訊息捲動 ---- */
function positionHintFab(btn){
  if(!btn) return;
  const chat = btn.closest('.chat');
  if(!chat) return;

  // 同一個聊天畫面永遠只保留目前這一顆提示鈕。
  // 舊提示鈕可能已被移到 .chat 底下，因此 action.innerHTML 更新時不會自動消失。
  chat.querySelectorAll('.hint-fab').forEach(oldBtn => {
    if(oldBtn !== btn) oldBtn.remove();
  });

  // 提示鈕不放在下方 action-area 黑欄裡，而是直接掛到 chat 上。
  if(btn.parentElement !== chat) chat.appendChild(btn);

  const actionArea = chat.querySelector('.action-area');
  const tapHint = chat.querySelector('.tap-hint');
  const actionH = actionArea ? actionArea.offsetHeight : 0;
  const tapH = tapHint && getComputedStyle(tapHint).display !== 'none' ? tapHint.offsetHeight : 0;
  btn.style.bottom = `${actionH + tapH + 12}px`;
}
